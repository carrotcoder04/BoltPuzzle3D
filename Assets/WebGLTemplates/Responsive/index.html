<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b2a4a; touch-action: none; -webkit-user-select: none; user-select: none; }
    body { background: radial-gradient(ellipse at center, #2c4a7c 0%, #14203a 75%); }
    /* Khung game: điện thoại / màn dọc → phủ kín; màn ngang (PC) → cột dọc 9:16 ở giữa */
    #frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,.45); }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #1b2a4a; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #fff; font: 600 16px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #1b2a4a; }
    #bar { width: 60%; max-width: 280px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.18); overflow: hidden; }
    #fill { width: 0; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #ffd34e, #ff9f1c); transition: width .15s; }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div>{{{ PRODUCT_NAME }}}</div><div id="bar"><div id="fill"></div></div></div>
  </div>
  <script>
    var frame = document.getElementById("frame");
    var canvas = document.getElementById("unity-canvas");
    // Tỉ lệ thiết kế (rộng / cao). Màn rộng hơn MAX_ASPECT sẽ được giới hạn thành cột dọc.
    var DESIGN_ASPECT = 9 / 16;
    var MAX_ASPECT = 0.75;

    function fit() {
      var w = window.innerWidth, h = window.innerHeight;
      if (window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
      var fw = w, fh = h;
      if (w / h > MAX_ASPECT) fw = Math.round(h * DESIGN_ASPECT);
      frame.style.width = fw + "px";
      frame.style.height = fh + "px";
    }
    fit();
    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", function () { setTimeout(fit, 200); });
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);

    var config = {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // nét trên màn Retina nhưng giới hạn x2 cho nhẹ máy
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };

    var fill = document.getElementById("fill");
    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { fill.style.width = (100 * p) + "%"; })
        .then(function () { document.getElementById("loading").style.display = "none"; fit(); })
        .catch(function (msg) { alert(msg); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
